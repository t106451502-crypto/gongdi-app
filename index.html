<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工地現場">
<meta name="theme-color" content="#111827">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="">
<title>工地現場管理</title>
<style>
:root{--y:#ffc400;--yd:#e0a800;--bg:#eef0f3;--ink:#111827;--mut:#6b7280;--line:#e2e5ea;--card:#fff;--red:#dc2626;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0f14;--ink:#e8ebf0;--mut:#8b96a5;--line:#232b35;--card:#151c25}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;color:var(--ink);background:var(--card)}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{flex:none;background:#111827;color:#fff;padding:calc(var(--sat) + 10px) 14px 10px;border-bottom:4px solid var(--y)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--y);color:#111827;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.projSelBtn{flex:1;min-width:0;height:44px;border-radius:10px;border:0;background:#1f2937;color:#fff;font-size:15px;font-weight:700;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden}
.projSelBtn .ptxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.projSelBtn .pill{flex:none}
.pickbtn{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:16px;font-weight:700;color:var(--ink)}
.pickbtn .pill{flex:none;margin-left:8px}
.themeBtn{width:44px;height:44px;border-radius:10px;background:#1f2937;border:0;color:#fff;font-size:20px;flex:none}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px}
nav.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab);height:calc(64px + var(--sab));position:relative}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut)}
.tab .ic{font-size:22px;line-height:1}
.tab.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--y)}
.fabwrap{display:flex;justify-content:center}
.fab{width:68px;height:68px;border-radius:50%;border:4px solid var(--card);background:var(--y);font-size:30px;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.fab:active{background:var(--yd)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pcard h2{margin:0 0 4px;font-size:19px}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:800;color:#fff;background:#16a34a}
.pill.off{background:#6b7280}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat{flex:1 1 0;min-width:0;background:rgba(127,127,127,.12);border-radius:10px;padding:8px 6px;text-align:center;overflow:hidden}
.stat b{display:block;font-size:clamp(13px,4.2vw,20px);line-height:1.2;word-break:break-word;overflow-wrap:break-word;white-space:normal}
.stat span{font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.stat.red b{color:var(--red)}
.search input{width:100%;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-size:15px;font-weight:700;color:var(--ink)}
.chip.on{background:#111827;color:#fff;border-color:#111827}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.rec{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rec:active{opacity:.8}
.rec img{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#ddd;flex:none}
.rb{flex:1;min-width:0}
.rt{font-weight:800;font-size:16px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{font-size:13px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:13px;font-weight:800;color:#fff}
.btn{min-height:52px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:16px;font-weight:800;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;cursor:pointer}
.btn.y{background:var(--y);border-color:var(--y);color:#111827}
.btn.dark{background:#111827;color:#fff;border-color:#111827}
.btn.red{background:var(--card);border-color:var(--red);color:var(--red)}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn:active{opacity:.75}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gap{height:10px}
.empty{text-align:center;color:var(--mut);padding:36px 10px;font-size:15px}
.empty .big{font-size:44px}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
.in{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--line);padding:10px 12px;font-size:16px;background:var(--card);font-family:inherit;color:var(--ink)}
textarea.in{min-height:90px;resize:vertical}
select.in{height:50px;padding:0 10px}
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.show{display:block}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:calc(94dvh - var(--sat));max-height:calc(94vh - var(--sat));overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:20px 20px 0 0;padding:calc(14px + var(--sat)) 14px calc(18px + var(--sab))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:18px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(127,127,127,.2);color:var(--ink);font-size:18px}
.cfOv{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.cfBox{width:100%;max-width:320px;background:var(--card);border-radius:16px;padding:20px 18px 18px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.cfMsg{font-size:15px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:18px;line-height:1.5}
.prevbox{height:190px;border-radius:14px;background:rgba(127,127,127,.2);display:flex;align-items:center;justify-content:center;color:var(--mut);margin:8px 0 10px;overflow:hidden;position:relative}
.prevbox img,.full{width:100%;height:100%;object-fit:contain;background:#000}
.full{height:auto;max-height:60vh;border-radius:12px;margin:8px 0}
.kv{font-size:15px;margin:6px 0;line-height:1.5}
.kv b{color:var(--mut);font-weight:700;margin-right:6px}
.proj.cur{border:3px solid var(--y)}
.proj h3{margin:0 0 4px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:90;display:none;max-width:88%;text-align:center}
#busy{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:800;gap:14px}
.spin{width:44px;height:44px;border:5px solid #fff5;border-top-color:var(--y);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cmpgrid{display:grid;gap:10px}
.cmpgrid.side{grid-template-columns:1fr 1fr}
.cmpbox{background:var(--card);border-radius:12px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmpbox img{width:100%;display:block;border-radius:8px;background:#000;min-height:90px}
.cmpbox select{width:100%;height:44px;font-size:14px;border-radius:8px;border:2px solid var(--line);margin-bottom:6px}
.cmpcap{font-size:13px;margin-top:4px;color:var(--mut)}
/* 更多選單 grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mitem{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12);border:0}
.mitem .ic{font-size:28px;display:block;margin-bottom:6px}
.mitem .lb{font-size:13px;font-weight:700}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.sw{width:52px;height:30px;border-radius:99px;background:#9ca3af;position:relative;border:0;flex:none}
.sw.on{background:var(--y)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{left:25px}
/* 工程人員組織架構圖（橫向網狀樹） */
.orgZoomRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.orgZoomRow button{width:38px;height:38px;border-radius:9px;border:0;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-size:18px;font-weight:800}
.orgZoomRow .zlabel{font-size:13px;font-weight:700;color:var(--mut);min-width:44px;text-align:center}
.orgWrap{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 4px 16px;touch-action:pan-x pan-y}
.tree{display:inline-block;min-width:100%;text-align:center;transform-origin:top left;white-space:nowrap}
.tree ul{padding-top:18px;position:relative;display:inline-table;margin:0 auto;white-space:nowrap}
.tree li{display:inline-block;text-align:center;list-style:none;position:relative;padding:18px 10px 0 10px;vertical-align:top;white-space:normal}
.tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:18px}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::after,.tree li:only-child::before{display:none}
.tree li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree>ul{padding-top:0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);width:0;height:18px}
.orgCard{display:inline-flex;flex-direction:column;align-items:stretch;gap:2px;background:var(--card);border-radius:12px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.12);border-top:4px solid var(--y);width:168px;white-space:normal;vertical-align:top;transition:opacity .2s}
.orgCard.lv0{border-top-color:#dc2626}
.orgCard.lv1{border-top-color:#2563eb}
.orgCard.lv2{border-top-color:#16a34a}
.orgCard.lv3{border-top-color:#9333ea}
.orgCard .ic{font-size:20px}
.orgCard .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgCard .mt{font-size:11.5px;color:var(--mut);word-break:break-word}
.orgCard .mt.phone{color:var(--ink);font-weight:700}
.orgCard .rolePill{display:inline-block;font-size:10px;font-weight:800;color:#fff;border-radius:99px;padding:1px 8px;margin:2px auto 0}
.orgCard .op{display:flex;gap:4px;margin-top:4px;justify-content:center}
.orgCard .op button{border:0;background:rgba(127,127,127,.15);border-radius:7px;width:26px;height:26px;font-size:12px}
.orgEmpty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
/* 月曆 */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-size:18px}
.calnavb{width:40px;height:40px;border-radius:10px;border:0;background:var(--card);font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--mut);font-weight:700;padding:4px 0}
.calday{aspect-ratio:1;border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;position:relative;border:2px solid transparent}
.calday.other{opacity:.28}
.calday.today{border-color:var(--y)}
.calday .dots{display:flex;gap:2px;margin-top:3px}
.calday .dots i{width:5px;height:5px;border-radius:50%;background:var(--y)}
.dlist{display:flex;gap:10px;padding:10px;border-radius:12px;background:rgba(127,127,127,.1);margin-bottom:8px;align-items:flex-start}
.dlist .ic2{font-size:20px;flex:none}
/* 進度 */
.pfloor{font-weight:800;margin:14px 0 6px;font-size:15px}
.pitem{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pitem .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.pbar{height:14px;border-radius:99px;background:rgba(127,127,127,.2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#22c55e);border-radius:99px}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grow{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:520px}
.glabel{width:120px;flex:none;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{flex:1;height:22px;background:rgba(127,127,127,.15);border-radius:8px;position:relative}
.gbar{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--y);font-size:11px;color:#111827;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;white-space:nowrap}
/* 報價表格 */
.qtable{width:100%;border-collapse:collapse;font-size:14px}
.qtable th,.qtable td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.qtable input{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:14px;background:var(--card);color:var(--ink)}
.qtotal{text-align:right;font-size:20px;font-weight:900;margin:10px 0}
.rmbtn{width:34px;height:34px;border-radius:8px;border:0;background:#fee2e2;color:var(--red);font-weight:900}
/* 巡檢表 */
.ckrow{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:8px}
.ckrow select{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ckrow input[type=text]{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--card);color:var(--ink)}
/* 圖紙標記 */
.bpwrap{position:relative;border-radius:12px;overflow:hidden;background:#000}
.bpwrap img{width:100%;display:block}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;background:var(--red);color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin span{transform:rotate(45deg)}
.pinlist{margin-top:8px}
.pinrow{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.pinrow b{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.expwarn{background:#fee2e2;color:var(--red);font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px}
#printRoot{display:none}
#repPrev{transform-origin:top left}
.pg{width:210mm;height:296mm;background:#fff;color:#000;margin:0 auto 12px;padding:10mm 10mm 7mm;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.25);overflow:hidden;-webkit-user-select:none}
.pg-t{text-align:center;font-size:24px;font-weight:800;letter-spacing:6px;margin:0 0 8px}
.pg-i{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:7px;table-layout:fixed}
.pg-i th,.pg-i td{border:1px solid #222;padding:4px 6px;text-align:left}
.pg-i th{background:#e9e9e9;width:74px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg-g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5mm;min-height:0}
.cell{border:1px solid #222;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{flex:1;min-height:0;position:relative;background:#f0f0f0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ct{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
.ct th,.ct td{border-top:1px solid #222;border-left:1px solid #222;padding:2px 4px;text-align:left;vertical-align:top;line-height:1.35}
.ct th{width:34px;background:#e9e9e9;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ct tr>*:first-child{border-left:0}
.ct .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{color:#fff;padding:0 5px;border-radius:3px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg-f{text-align:center;font-size:10px;color:#444;margin-top:4px}
.pg-doc{width:210mm;min-height:296mm;background:#fff;color:#000;margin:0 auto 12px;padding:14mm;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pg-doc h1{font-size:22px;text-align:center;letter-spacing:4px}
.pg-doc table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.pg-doc th,.pg-doc td{border:1px solid #333;padding:5px 7px;text-align:left}
.pg-doc th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;background:#fff;overflow:visible}
  #app,#modal,#toast,#busy{display:none!important}
  #printRoot{display:block!important}
  .pg,.pg-doc{margin:0;box-shadow:none;page-break-after:always;break-after:page}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="hrow">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 15a8 8 0 0 1 16 0v0.5H4V15z" fill="#fff"/><rect x="2" y="15" width="20" height="2.6" rx="1.3" fill="#fff"/><rect x="10.5" y="6.5" width="3" height="3" rx="1" fill="#fff"/><path d="M6.5 17.6c-1 1.6-1 3.2-0.3 4.6" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M17.5 17.6c1 1.6 1 3.2 0.3 4.6" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M6.2 22.2q5.8 2.2 11.6 0" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg></div>
      <button id="projSel" class="projSelBtn" onclick="openProjectPicker()"></button>
      <button class="themeBtn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="busy"><div class="spin"></div><div id="busyTxt">處理中…</div></div>
<div id="printRoot"></div>

<script>
'use strict';
/* ========== 常數與工具 ========== */
const ST={
  before:{n:'施工前',c:'#475569'},
  doing:{n:'施工中',c:'#d97706'},
  done:{n:'完工',c:'#15803d'},
  defect:{n:'待改善',c:'#dc2626'},
  fixed:{n:'已改善',c:'#0f766e'}
};
const STK=Object.keys(ST);

const EXTRA_STORES=['materials','workers','inspections','meetings','memos','attendance','progressItems','blueprints','blueprintPhotos','finance','orgNodes','vendors','progCats'];
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('sitelog_db',6);
  r.onupgradeneeded=()=>{
    const d=r.result;
    if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
    if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'}).createIndex('projectId','projectId');
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    EXTRA_STORES.forEach(n=>{
      if(!d.objectStoreNames.contains(n)){
        const s=d.createObjectStore(n,{keyPath:'id'});
        if(n!=='blueprintPhotos')s.createIndex('projectId','projectId');
      }
    });
  };
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const store=(n,m)=>db.transaction(n,m||'readonly').objectStore(n);
const dbAll=n=>req(store(n).getAll());
const dbGet=(n,k)=>req(store(n).get(k));
const dbPut=(n,v)=>req(store(n,'readwrite').put(v));
const dbDel=(n,k)=>req(store(n,'readwrite').delete(k));
const dbByProj=n=>curId?req(store(n).index('projectId').getAll(curId)):Promise.resolve([]);
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
function savePhotoRecord(rec,blob){const t=db.transaction(['records','photos'],'readwrite');t.objectStore('records').put(rec);t.objectStore('photos').put({id:rec.id,blob:blob});return txDone(t);}
function delRecordDB(ids){const t=db.transaction(['records','photos'],'readwrite');ids.forEach(id=>{t.objectStore('records').delete(id);t.objectStore('photos').delete(id);});return txDone(t);}

async function saveBlob(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:name});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
}
async function shareText(title,text){
  if(navigator.share){try{await navigator.share({title:title,text:text});return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text);toast('已複製到剪貼簿，可貼到 LINE 分享');}catch(e){alert(text);}
}
function toCSV(rows,headers){
  const esc2=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[headers.map(h=>esc2(h.label)).join(',')].concat(rows.map(r=>headers.map(h=>esc2(typeof h.get==='function'?h.get(r):r[h.key])).join(',')));
  return new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
}

async function projectFinSummary(p){
  const contract=parseFloat(p.finalContract)||0;
  const dedList=(p.deductions&&p.deductions.length)?p.deductions:DEFAULT_DEDUCTIONS;
  const dedSum=dedList.reduce((s,d)=>s+contract*(parseFloat(d.pct)||0)/100,0);
  const net=contract-dedSum;
  const mats=await req(store('materials').index('projectId').getAll(p.id));
  const matCost=mats.reduce((s,it)=>s+materialAmount(it),0);
  const profit=net-matCost;
  const profitPct=contract?profit/contract*100:0;
  return {contract:contract,profit:profit,profitPct:profitPct};
}

  pending.file=f;pending.time=Date.now();stickers=[];
  if(pending.url)URL.revokeObjectURL(pending.url);
  pending.url=URL.createObjectURL(f);
  $('prevBox').innerHTML='<img src="'+pending.url+'">';
  renderStickers();
  const t=$('fTitle');if(t&&!t.value)t.focus();
}
function renderStickers(){
  const el=$('stkList');if(!el)return;
  el.innerHTML=stickers.map((s,i)=>'<div class="pinrow"><b>'+(i+1)+'</b><div style="flex:1">'+esc(s.text)+'</div><button class="rmbtn" onclick="stickers.splice('+i+',1);renderStickers()">✕</button></div>').join('');

function addSticker(){
  if(!pending.file){toast('請先選擇照片');return;}
  const t=prompt('輸入要加在照片上的文字標記：');

async function saveRecord(id){
  const title=$('fTitle').value.trim(),loc=$('fLoc').value.trim(),desc=$('fDesc').value.trim(),status=formStatus;
  if(!title){toast('請輸入工項／缺失標題');$('fTitle').focus();return;}
  const p=curProject();
  if(id){
    const r=recs.find(x=>x.id===id);
    Object.assign(r,{title:title,desc:desc,location:loc,status:status,updatedAt:Date.now()});
    await dbPut('records',r);closeModal();await loadRecs();render();toast('已更新');return;
  }
  if(!pending.file){toast('請先拍照或選擇照片');return;}
  busy(true,'壓縮並燒錄浮水印…');
  try{
    const time=pending.time;
    const out=await stamp(pending.file,{project:p.name,time:time,location:loc,title:title,status:status,stickers:stickers});
    const rec={id:uid(),projectId:p.id,title:title,desc:desc,location:loc,status:status,createdAt:time,thumb:out.thumb,w:out.w,h:out.h};
    await savePhotoRecord(rec,out.blob);

    closeModal();await loadRecs();
    state.view='records';state.f='all';state.q='';render();toast('✔ 已儲存（已加浮水印）');
  }catch(e){alert('照片處理失敗：'+(e&&e.message||e));}
  finally{busy(false);}
}

/* ========== 影像處理：壓縮 + 浮水印 + 文字標記 ========== */
async function loadBitmap(file){
  if(window.createImageBitmap){
    try{return await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){}
  }
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),i=new Image();
    i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),3000);};
    i.onerror=()=>rej(new Error('無法讀取此照片格式'));i.src=u;
  });
}
function cvBlob(c,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('輸出失敗')),'image/jpeg',q));}
function fitText(ctx,t,max){
  if(ctx.measureText(t).width<=max)return t;
  while(t.length>1&&ctx.measureText(t+'…').width>max)t=t.slice(0,-1);
  return t+'…';
}
function checksum(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16).toUpperCase().padStart(8,'0').slice(0,6);}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function stamp(file,info){
  const MAXW=1400;
  const bmp=await loadBitmap(file);
  const sw=bmp.width,sh=bmp.height;
  const sc=Math.min(1,MAXW/sw);
  const w=Math.round(sw*sc),h=Math.round(sh*sc);
  const fs=Math.max(18,Math.round(w/40)),padv=Math.round(fs*.7),lh=Math.round(fs*1.5);
  const barH=padv*2+lh*3-Math.round(fs*.2);
  const c=document.createElement('canvas');c.width=w;c.height=h+barH;
  const x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,w,h+barH);
  x.drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();
  /* 使用者手動文字標記（貼在照片主體，非底部資訊條） */
  if(info.stickers&&info.stickers.length){
    const sfs=Math.max(20,Math.round(w/28));
    x.font='800 '+sfs+'px -apple-system,"PingFang TC","Noto Sans TC",sans-serif';
    info.stickers.forEach((s,i)=>{
      const tx=Math.round(w*0.06),ty=Math.round(h*0.1)+i*(sfs+14);
      const tw=x.measureText(s.text).width+20;
      x.fillStyle='rgba(220,38,38,.88)';rrect(x,tx-10,ty-sfs*0.8,tw,sfs*1.5,8);x.fill();
      x.fillStyle='#fff';x.textBaseline='middle';x.fillText(s.text,tx,ty-sfs*0.05);
    });
  }
  const px=Math.round(fs*.8),maxw=w-px*2;
  x.textBaseline='middle';
  const y1=h+padv+lh*.5-Math.round(fs*.1),y2=y1+lh,y3=y2+lh;
  /* 第1行：工程名稱 */
  x.font='800 '+Math.round(fs*1.1)+'px -apple-system,"PingFang TC","Noto Sans TC",sans-serif';
  x.fillStyle='#ffc400';x.fillText(fitText(x,'工程：'+info.project,maxw),px,y1);
  /* 第2行：時間 + 狀態標籤 */
  x.font='700 '+fs+'px -apple-system,"PingFang TC","Noto Sans TC",monospace';
  const tag=wmTag(info.status),tw=x.measureText(tag).width+fs;
  x.fillStyle='#fff';x.fillText(fitText(x,'時間：'+fmt(info.time),maxw-tw-px),px,y2);
  x.fillStyle=ST[info.status].c;rrect(x,w-px-tw,y2-fs*.75,tw,fs*1.5,fs*.3);x.fill();
  x.fillStyle='#fff';x.textAlign='center';x.fillText(tag,w-px-tw/2,y2);x.textAlign='left';
  /* 第3行：位置 / 項目 + 驗證碼 */
  const code='#'+checksum(info.project+info.time+info.title+info.location);
  x.font='600 '+Math.round(fs*.9)+'px -apple-system,"PingFang TC","Noto Sans TC",monospace';
  const cw=x.measureText(code).width+px;
  x.fillStyle='#e5e7eb';x.fillText(fitText(x,'位置：'+(info.location||'—')+'　項目：'+info.title,maxw-cw),px,y3);
  x.fillStyle='#9ca3af';x.textAlign='right';x.fillText(code,w-px,y3);x.textAlign='left';
  const blob=await cvBlob(c,0.82);
  const tc=document.createElement('canvas');const tsc=360/w;tc.width=360;tc.height=Math.round((h+barH)*tsc);
  tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
  return{blob:blob,thumb:tc.toDataURL('image/jpeg',0.7),w:w,h:h+barH};
}

/* ========== 照片對比 ========== */
const locKey=r=>(r.location||'').trim()||'（未填位置）';
function autoPick(loc){
  const l=recs.filter(r=>locKey(r)===loc).sort((a,b)=>a.createdAt-b.createdAt);
  const b=l.filter(r=>isBefore(r.status)),a=l.filter(r=>isAfter(r.status));
  cmp.l=(b[0]||l[0]||{}).id||'';
  cmp.r=(a[a.length-1]||l[l.length-1]||{}).id||'';
}
function compareFrom(id){
  const r=recs.find(x=>x.id===id);if(!r)return;
  cmp.loc=locKey(r);autoPick(cmp.loc);
  if(isBefore(r.status))cmp.l=id;else cmp.r=id;
  closeModal();go('compare');
}
function viewCompare(){
  const locs=[...new Set(recs.map(locKey))];
  if(recs.length<2||!locs.length)return '<div class="empty"><div class="big">🔀</div><p>至少需要 2 筆紀錄才能對比<br>建議同一位置分別拍「施工前」與「完工／已改善」</p></div>';
  if(!locs.includes(cmp.loc)){cmp.loc=locs[0];autoPick(cmp.loc);}
  const inLoc=recs.filter(r=>locKey(r)===cmp.loc).sort((a,b)=>a.createdAt-b.createdAt);
  if(!inLoc.find(r=>r.id===cmp.l)||!inLoc.find(r=>r.id===cmp.r))autoPick(cmp.loc);
  const opts=sel=>inLoc.map(r=>'<option value="'+r.id+'" '+(sel===r.id?'selected':'')+'>['+ST[r.status].n+'] '+esc(r.title)+' '+fmt(r.createdAt).slice(5,16)+'</option>').join('');
  const box=(side,sel)=>{const r=recs.find(x=>x.id===sel);return '<div class="cmpbox"><select onchange="cmp.'+side+'=this.value;go(\'compare\')">'+opts(sel)+'</select>'+(r?'<img data-pid="'+r.id+'" src="'+r.thumb+'" onclick="openDetail(\''+r.id+'\')"><div class="cmpcap"><span class="badge" style="background:'+ST[r.status].c+'">'+ST[r.status].n+'</span> '+fmtD(r.createdAt)+'</div>':'')+'</div>';};
  return '<button class="btn sm" style="margin-bottom:10px" onclick="go(\'more\')">← 返回更多</button><div class="card"><label class="f" style="margin-top:0">選擇施作位置</label><select class="in" onchange="cmp.loc=this.value;autoPick(cmp.loc);go(\'compare\')">'+locs.map(l=>'<option '+(l===cmp.loc?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+
    '<div class="two" style="margin-top:10px"><button class="chip '+(cmp.layout==='side'?'on':'')+'" onclick="cmp.layout=\'side\';go(\'compare\')">◫ 並列</button><button class="chip '+(cmp.layout==='stack'?'on':'')+'" onclick="cmp.layout=\'stack\';go(\'compare\')">▤ 上下</button></div></div>'+
    '<div class="cmpgrid '+cmp.layout+'">'+box('l',cmp.l)+box('r',cmp.r)+'</div><div class="gap"></div>'+
    '<button class="btn y" onclick="exportCompare()">💾 匯出對比圖（儲存／分享）</button>';
}
async function exportCompare(){
  const L=recs.find(x=>x.id===cmp.l),R=recs.find(x=>x.id===cmp.r),p=curProject();
  if(!L||!R){toast('請選擇兩張照片');return;}
  busy(true,'產生對比圖…');
  try{
    const imgs=await Promise.all([L,R].map(async r=>{const i=new Image();i.src=await getFull(r.id);await i.decode();return i;}));
    const H=1100,ws=imgs.map(i=>Math.round(i.width*H/i.height)),gap=20,top=120,lab=70;
    const W=ws[0]+ws[1]+gap*3,c=document.createElement('canvas');c.width=W;c.height=top+lab+H+gap;
    const x=c.getContext('2d');x.fillStyle='#111827';x.fillRect(0,0,W,c.height);
    x.textBaseline='middle';x.font='800 40px -apple-system,"PingFang TC",sans-serif';x.fillStyle='#ffc400';
    x.fillText(fitText(x,p.name+'　'+cmp.loc,W-gap*2),gap,top/2);
    let ox=gap;
    [L,R].forEach((r,k)=>{
      x.fillStyle=ST[r.status].c;rrect(x,ox,top,ws[k],lab-10,10);x.fill();
      x.fillStyle='#fff';x.font='800 34px -apple-system,"PingFang TC",sans-serif';x.fillText(ST[r.status].n+'　'+fmtD(r.createdAt),ox+16,top+(lab-10)/2);
      x.drawImage(imgs[k],ox,top+lab,ws[k],H);ox+=ws[k]+gap;
    });
    await saveBlob(await cvBlob(c,0.85),'compare_'+fmtD(Date.now()).replace(/-/g,'')+'.jpg');
  }catch(e){alert('匯出失敗：'+(e&&e.message||e));}
  finally{busy(false);}
}

async function collectDay(dateStr){
  const out=[];
  recs.filter(r=>fmtD(r.createdAt)===dateStr).forEach(r=>out.push({ic:'📷',t:r.title,s:ST[r.status].n,raw:r}));
  (mdata.materials||[]).filter(x=>x.date===dateStr).forEach(x=>out.push({ic:matCatIcon(x.category),t:x.name,s:x.category==='零用金'?(x.pettyType||'零用金')+' '+money(x.amount):(x.category||'')+'　'+(x.qty||'')+(x.unit||''),raw:x}));
  (mdata.meetings||[]).filter(x=>x.date===dateStr).forEach(x=>out.push({ic:'🗒',t:x.title,s:'會議',raw:x}));
  (mdata.memos||[]).filter(x=>x.date===dateStr).forEach(x=>out.push({ic:'📝',t:x.content?x.content.slice(0,20):'備忘錄',s:'備忘',raw:x}));
  (mdata.attendance||[]).filter(x=>x.date===dateStr).forEach(x=>out.push({ic:'🧍',t:x.worker||'—',s:x.status||'出工',raw:x}));
  (mdata.progCats||[]).forEach(c=>{
    (c.workDays||[]).filter(x=>x.date===dateStr).forEach(x=>out.push({ic:'🛠',t:c.name+(x.subName?'／'+x.subName:'')+' 施工',s:(x.workers||0)+'人到場',raw:x}));
    (c.subItems||[]).forEach(s=>(s.events||[]).filter(e=>e.date===dateStr).forEach(e=>out.push({ic:e.type==='submit'?'📮':'✅',t:c.name+'／'+s.name,s:e.type==='submit'?'已送審':'審核通過',raw:e})));
  });
  return out;
}

/* ========== 工程進度（分項工程加權 SOP + 甘特圖） ========== */
const FLOOR_OPTS=['1F','2F','3F','4F','5F','B1','屋突/機房','全棟'];
const PREP_OPTS=['圖面'];
const PIPE_OPTS=['銅管配管工程','水管配管工程','排水管配管工程','保溫管配管工程'];
const PROG_CATALOG=[
  {key:'prep',baseKey:'prep',baseWeight:5,name:'前期規劃與設備送審',mode:'percent',subKind:'approval',subCatalog:PREP_OPTS},
  {key:'equip_in',baseKey:'equip',baseWeight:35,name:'設備進場',mode:'qty'},
  {key:'equip_hoist',baseKey:'equip',baseWeight:35,name:'設備吊裝',mode:'qty'},
  {key:'piping',baseKey:'piping',baseWeight:25,name:'配管工程',mode:'percent',subKind:'percent',subCatalog:PIPE_OPTS},
  {key:'electrical',baseKey:'electrical',baseWeight:15,name:'配電工程',mode:'percent',subKind:'percent',subCatalog:null},
  {key:'tab',baseKey:'tab',baseWeight:15,name:'系統試車與調整',mode:'percent',subKind:'done',subCatalog:null},
  {key:'handover',baseKey:'handover',baseWeight:5,name:'竣工驗收與移交',mode:'percent',subKind:'percent',subCatalog:null}
];
const APR_LABEL={none:'未送審',pending:'待審核',approved:'已審核通過'};
const APR_PCT={none:0,pending:50,approved:100};
function catPercent(c){
  const items=c.subItems||[];
  if(c.mode==='qty'){
    const tot=items.reduce((s,x)=>s+(parseFloat(x.total)||0),0);
    const done=items.reduce((s,x)=>s+Math.min(parseFloat(x.done)||0,parseFloat(x.total)||0),0);
    return tot?Math.round(done/tot*100):0;
  }
  if(!items.length)return Math.round(parseFloat(c.manualPercent)||0);
  return Math.round(items.reduce((s,x)=>s+(parseFloat(x.percent)||0),0)/items.length);
}
function catWeight(c,cats){
  if(c.na)return 0;
  const n=cats.filter(x=>x.baseKey===c.baseKey&&!x.na).length||1;
  return (parseFloat(c.baseWeight)||0)/n;
}
function overallProgress(cats){
  const total=cats.reduce((s,c)=>s+catWeight(c,cats),0);
  if(!total)return cats.length?Math.round(cats.reduce((s,c)=>s+catPercent(c),0)/cats.length):0;
  return Math.round(cats.reduce((s,c)=>s+catWeight(c,cats)*catPercent(c),0)/total);
}
async function ensureProgCats(){
  const p=curProject();if(!p)return;
  await loadMod('progCats');
  const existing=new Set((mdata.progCats||[]).map(c=>c.catKey));
  const missing=PROG_CATALOG.filter(e=>!existing.has(e.key));
  let order=(mdata.progCats||[]).length;
  for(const e of missing){
    await dbPut('progCats',{id:uid(),projectId:p.id,createdAt:Date.now(),order:order++,name:e.name,catKey:e.key,baseKey:e.baseKey,baseWeight:e.baseWeight,mode:e.mode,subKind:e.subKind||'percent',subCatalog:e.subCatalog||null,start:'',end:'',manualPercent:0,workDays:[],subItems:[]});
  }
  // 修正舊資料：配電/試車調整/竣工驗收 不應再帶有內建樓層選單，改為一律手動輸入；系統試車與調整改為完成試車自動計算百分比
  let fixed=false;
  for(const c of (mdata.progCats||[])){
    const tpl=PROG_CATALOG.find(e=>e.key===c.catKey);
    if(!tpl)continue;
    if((tpl.subCatalog||null)===null&&c.subCatalog){
      c.subCatalog=null;await dbPut('progCats',c);fixed=true;
    }
    if(tpl.subKind&&c.subKind!==tpl.subKind){
      c.subKind=tpl.subKind;await dbPut('progCats',c);fixed=true;
    }
  }
  if(missing.length||fixed)await loadMod('progCats');
}

  const p=curProject();

    const todayMid=new Date();todayMid.setHours(0,0,0,0);

    const remain=Math.round((endMid-todayMid)/86400000);
    daysStat='<div class="stat"><b style="'+(remain<0?'color:#dc2626':'')+'">'+(remain<0?'逾期'+Math.abs(remain):remain)+'</b><span>距離合約完工日（天）</span></div>';
  }
  let html='<div class="card"><h2 style="margin:0 0 8px">工程進度總覽</h2><div class="stats">'+
    '<div class="stat"><b>'+overall+'%</b><span>總體進度（加權）</span></div>'+
    '<div class="stat"><b>'+monthWork+'</b><span>本月出工數</span></div>'+
    '<div class="stat"><b>'+cats.filter(c=>!c.na&&catPercent(c)>=100).length+'</b><span>已完成分項</span></div>'+daysStat+'</div></div>';
  if(!cats.length)html+='<div class="empty"><div class="big">📈</div><p>尚無分項工程</p></div>';
  cats.forEach(c=>{
    if(c.na){
      html+='<div class="pitem" style="opacity:.45;filter:grayscale(1)" onclick="openCatDetail(\''+c.id+'\')"><div class="top"><span>'+esc(c.name)+'</span><span class="badge" style="background:#6b7280">🚫 無此工程</span></div></div>';
      return;
    }
    const pct=catPercent(c),done=pct>=100,today=todayStr(),wdays=c.workDays||[];
    const trackWork=c.catKey!=='prep'&&c.catKey!=='handover';
    const distinctDays=new Set(wdays.map(x=>x.date)).size;
    const totalWorkers=wdays.reduce((s,x)=>s+(parseFloat(x.workers)||0),0);
    const multi=(c.subItems||[]).length>=2;
    const todayEntry=wdays.find(x=>x.date===today&&!x.subId);
    const workedToday=!!todayEntry;
    const todayMultiEntries=multi?wdays.filter(x=>x.date===today):[];
    const todayMultiWorkers=todayMultiEntries.reduce((s,x)=>s+(parseFloat(x.workers)||0),0);
    html+='<div class="pitem" onclick="openCatDetail(\''+c.id+'\')"><div class="top"><span>'+esc(c.name)+'</span><span>'+(done?'<span class="badge" style="background:#16a34a">✅ 已完工</span> ':'')+pct+'%</span></div><div class="pbar"><i style="width:'+pct+'%"></i></div>'+
      (trackWork?(
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap">'+
      '<span class="mut" style="font-size:12px">已施工 <b>'+distinctDays+'</b> 天・共 <b>'+totalWorkers+'</b> 人次'+(c.start||c.end?'　'+(c.start||'—')+' ～ '+(c.end||'—'):'')+'</span>'+
      (done?'':
        multi?
          '<button class="btn sm" style="width:auto;min-height:34px;padding:0 10px;flex:none;'+(todayMultiEntries.length?'background:#16a34a;color:#fff':'')+'" onclick="event.stopPropagation();openCatDetail(\''+c.id+'\')">'+(todayMultiEntries.length?'✅ 今日已記錄（'+todayMultiWorkers+'人）':'🛠 本日進場施工（選細項）')+'</button>'
        :(workedToday?
          '<button class="btn sm" style="width:auto;min-height:34px;padding:0 10px;flex:none;background:#16a34a;color:#fff" onclick="event.stopPropagation();toggleWorkToday(\''+c.id+'\')">✅ 今日已記錄（'+(todayEntry.workers||0)+'人）</button>'
          :'<span onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:6px;flex:none">'+
            '<input type="number" min="1" value="1" id="wk_'+c.id+'" style="width:52px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center">'+
            '<span class="mut" style="font-size:12px">人</span>'+
            '<button class="btn sm" style="width:auto;min-height:34px;padding:0 10px" onclick="event.stopPropagation();toggleWorkToday(\''+c.id+'\',\'wk_'+c.id+'\')">🛠 本日進場施工</button>'+
          '</span>'))+
      '</div>'
      ):(c.start||c.end?'<div style="margin-top:8px"><span class="mut" style="font-size:12px">'+(c.start||'—')+' ～ '+(c.end||'—')+'</span></div>':''))+
      '</div>';
  });
  if(cats.some(c=>!c.na&&c.start&&c.end)){
    html+='<div class="pfloor">📊 簡易甘特圖（'+(mo_1(now))+' 月）</div><div class="gwrap"><div style="min-width:520px">';
    const dim=daysInMonth(now.getFullYear(),now.getMonth());
    cats.filter(c=>!c.na&&c.start&&c.end).forEach(c=>{
      const sd=new Date(c.start+'T00:00:00'),ed=new Date(c.end+'T00:00:00');
      const sD=(sd.getMonth()===now.getMonth())?sd.getDate():1;
      const eD=(ed.getMonth()===now.getMonth())?ed.getDate():dim;
      const left=Math.max(0,(sD-1)/dim*100),width=Math.max(4,(eD-sD+1)/dim*100);
      html+='<div class="grow"><div class="glabel">'+esc(c.name)+'</div><div class="gtrack"><div class="gbar" style="left:'+left+'%;width:'+width+'%">'+catPercent(c)+'%</div></div></div>';
    });
    html+='</div></div>';
  }
  m.innerHTML=html;
}
function mo_1(d){return d.getMonth()+1;}
async function toggleWorkToday(id,workersInputId,subId,subName){
  const c=(mdata.progCats||[]).find(x=>x.id===id);if(!c)return;
  const t=todayStr(),sid=subId||'';c.workDays=c.workDays||[];
  const idx=c.workDays.findIndex(x=>x.date===t&&(x.subId||'')===sid);
  let msg;
  if(idx>=0){c.workDays.splice(idx,1);msg='已取消本日記錄';}
  else{
    let n=1;
    if(workersInputId){const el=document.getElementById(workersInputId);if(el)n=Math.max(1,parseInt(el.value)||1);}
    c.workDays.push({date:t,workers:n,subId:sid,subName:subName||''});c.workDays.sort((a,b)=>a.date.localeCompare(b.date));
    msg='已記錄本日施工'+(subName?'（'+subName+'　'+n+'人）':'（'+n+'人）');
  }
  await dbPut('progCats',c);await loadMod('progCats');renderProgress();
  if($('modal').classList.contains('show'))openCatDetail(id);
  toast(msg);
}

async function updateCatField(id,field,value){
  const c=(mdata.progCats||[]).find(x=>x.id===id);if(!c)return;
  c[field]=value;await dbPut('progCats',c);await loadMod('progCats');renderProgress();
  if($('modal').classList.contains('show'))openCatDetail(id);
}
async function updateSubField(catId,subId,field,value){
  const c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  const s=(c.subItems||[]).find(x=>x.id===subId);if(!s)return;
  s[field]=value;await dbPut('progCats',c);
  if(c.catKey==='equip_in'&&(field==='name'||field==='total'))await syncEquipHoist(c);
  await loadMod('progCats');renderProgress();
  if($('modal').classList.contains('show'))openCatDetail(catId);
}
async function syncEquipHoist(equipInCat){
  const hoist=(mdata.progCats||[]).find(x=>x.catKey==='equip_hoist'&&x.projectId===equipInCat.projectId);
  if(!hoist)return;
  const inSubs=equipInCat.subItems||[];
  const hoistMap=new Map((hoist.subItems||[]).map(s=>[s.id,s]));
  hoist.subItems=inSubs.map(s=>{
    const ex=hoistMap.get(s.id);
    return {id:s.id,name:s.name,total:s.total,done:ex?(ex.done||0):0};
  });
  await dbPut('progCats',hoist);
}
async function submitForReview(catId,subId){
  const c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  const s=(c.subItems||[]).find(x=>x.id===subId);if(!s)return;
  s.status='pending';s.percent=APR_PCT.pending;
  s.events=s.events||[];s.events.push({date:todayStr(),type:'submit'});
  await dbPut('progCats',c);await loadMod('progCats');renderProgress();
  if($('modal').classList.contains('show'))openCatDetail(catId);
  toast('已送審，記錄於月曆');
}
async function approveReview(catId,subId){
  const c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  const s=(c.subItems||[]).find(x=>x.id===subId);if(!s)return;

  if($('modal').classList.contains('show'))openCatDetail(catId);
  toast('已審核通過，記錄於月曆');
}
let addSubCtx='';
function addSubItem(catId){
  const c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  addSubCtx=catId;
  const isQty=c.mode==='qty',catalog=c.subCatalog||null;
  if(isQty||!catalog){
    modal('<div class="sheet-h"><b>新增細項</b><button class="x" onclick="openCatDetail(\''+catId+'\')">✕</button></div>'+
      '<label class="f" style="margin-top:0">項目名稱 *</label><input class="in" id="siName" placeholder="'+(isQty?'例如：冰水主機':'例如：熱水管配管')+'">'+
      (isQty?'<label class="f">總數量</label><input class="in" type="number" id="siTotal" value="1">':'')+
      '<div class="gap"></div><button class="btn dark" onclick="saveSubItem()">💾 新增</button>');
    return;
  }
  modal('<div class="sheet-h"><b>'+(c.subKind==='approval'?'新增送審項目':'新增細項')+'</b><button class="x" onclick="openCatDetail(\''+catId+'\')">✕</button></div>'+
    '<label class="f" style="margin-top:0">選擇項目</label><select class="in" id="siSel" onchange="$(\'siCustom\').style.display=this.value===\'__other\'?\'block\':\'none\'">'+
    catalog.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'<option value="__other">其他（自行輸入）</option></select>'+
    '<input class="in" id="siCustom" placeholder="輸入自訂名稱" style="display:none;margin-top:8px">'+
    '<div class="gap"></div><button class="btn dark" onclick="saveSubItem()">💾 新增</button>');
}
async function saveSubItem(){
  const catId=addSubCtx,c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  let name;
  if($('siSel')){name=$('siSel').value==='__other'?$('siCustom').value.trim():$('siSel').value;}
  else name=$('siName').value.trim();
  if(!name){toast('請輸入項目名稱');return;}
  let s;
  if(c.mode==='qty')s={id:uid(),name:name,total:parseFloat($('siTotal').value)||1,done:0};
  else if(c.subKind==='approval')s={id:uid(),name:name,status:'none',percent:0,events:[]};
  else s={id:uid(),name:name,percent:0};
  c.subItems=c.subItems||[];c.subItems.push(s);
  await dbPut('progCats',c);
  if(c.catKey==='equip_in')await syncEquipHoist(c);
  await loadMod('progCats');renderProgress();
  openCatDetail(catId);
}
async function delSubItem(catId,subId){
  const c=(mdata.progCats||[]).find(x=>x.id===catId);if(!c)return;
  if(!(await askConfirm('確定刪除此細項？')))return;
  c.subItems=(c.subItems||[]).filter(x=>x.id!==subId);
  await dbPut('progCats',c);
  if(c.catKey==='equip_in')await syncEquipHoist(c);
  await loadMod('progCats');renderProgress();
  openCatDetail(catId);
}
async function toggleCatNA(id){
  const c=(mdata.progCats||[]).find(x=>x.id===id);if(!c)return;
  const turningOn=!c.na;
  if(turningOn){
    if(!(await askConfirm('確定將「'+c.name+'」標記為無此工程？此分項的權重將依比例分配給其他分項工程，之後仍可恢復。')))return;
  }
  c.na=turningOn;
  await dbPut('progCats',c);closeModal();await loadMod('progCats');renderProgress();
  toast(turningOn?'已標記為無此工程':'已恢復此工程');
}

function orgApplyZoom(){
  const t=$('orgTree');if(t)t.style.transform='scale('+orgZoom+')';
  const lbl=$('orgZoomLbl');if(lbl)lbl.textContent=Math.round(orgZoom*100)+'%';
}

  orgZoom=Math.min(1.8,Math.max(0.4,+(orgZoom+delta).toFixed(2)));

}
function orgZoomReset(){orgZoom=1;orgApplyZoom();}
function orgBindZoomGesture(){
  const el=$('orgWrap');if(!el||el.__orgPinchBound)return;
  el.__orgPinchBound=true;
  let startDist=0,startZoom=1;
  el.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      startZoom=orgZoom;
    }
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&startDist>0){
      e.preventDefault();
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      orgZoom=Math.min(1.8,Math.max(0.4,startZoom*(dist/startDist)));
      orgApplyZoom();
    }
  },{passive:false});
  el.addEventListener('touchend',function(e){if(e.touches.length<2)startDist=0;},{passive:true});
}

const DEFAULT_DEDUCTIONS=[

function materialAmount(it){return it.category==='零用金'?(parseFloat(it.amount)||0):(parseFloat(it.qty)||0)*(parseFloat(it.price)||0);}
function matCostTotal(){return (mdata.materials||[]).reduce((s,it)=>s+materialAmount(it),0);}
function money(n){return 'NT$ '+Math.round(n||0).toLocaleString();}
function romanBasic(n){
  const map=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let res='';for(const pair of map){while(n>=pair[0]){res+=pair[1];n-=pair[0];}}
  return res;
}
function overline(s){return s.split('').map(c=>c+'̅').join('');}
function toRoman(num){
  num=Math.round(num||0);if(num<=0)return '';
  const millions=Math.floor(num/1000000);
  const rem=num%1000000;
  const thousands=Math.floor(rem/1000);
  const units=rem%1000;
  let res='';
  if(millions>0)res+=overline(overline(romanBasic(millions)))+' ';
  if(thousands>0)res+=overline(romanBasic(thousands))+' ';
  res+=romanBasic(units)||(res?'':'N');
  return res.trim();
}
function cnFour(num){
  const CN=['零','壹','貳','參','肆','伍','陸','柒','捌','玖'],UNIT=['','拾','佰','仟'];
  const d=String(num).padStart(4,'0').split('').map(Number);
  let s='',zero=false,started=false;
  for(let i=0;i<4;i++){
    if(d[i]===0){if(started)zero=true;}
    else{if(zero){s+=CN[0];zero=false;}s+=CN[d[i]]+UNIT[3-i];started=true;}
  }
  return s;
}
function toChineseCapital(n){
  n=Math.round(n||0);
  if(n<=0)return '零元整';
  const BIG=['','萬','億','兆'];
  let parts=[],x=n;
  while(x>0){parts.unshift(x%10000);x=Math.floor(x/10000);}
  let s='';
  for(let i=0;i<parts.length;i++){
    const seg=parts[i],pos=parts.length-1-i;
    if(seg===0){if(s&&!s.endsWith('零'))s+='零';continue;}
    const segStr=cnFour(seg);
    s+=(s.endsWith('零')||!s?'':(seg<1000&&i>0?'零':''))+segStr+BIG[pos];
  }
  s=s.replace(/零+/g,'零').replace(/零$/,'').replace(/零(萬|億|兆)/g,'$1');
  return s+'元整';
}
function pct1(n){return (Math.round((n||0)*10)/10).toString().replace(/\.0$/,'');}

function projDurationDays(p){
  const start=p.startDate?new Date(p.startDate+'T00:00:00').getTime():(p.createdAt||Date.now());
  const end=p.completedAt||Date.now();
  return Math.max(1,Math.round((end-start)/86400000)+1);
}

function ctxEllipsis(ctx,text,maxW){
  text=String(text==null?'':text);
  if(ctx.measureText(text).width<=maxW)return text;
  while(text.length>1&&ctx.measureText(text+'…').width>maxW)text=text.slice(0,-1);
  return text+'…';
}
function closeoutImageBlob(p){
  const contract=parseFloat(p.finalContract)||0;
  const dedList=(p.deductions&&p.deductions.length)?p.deductions:DEFAULT_DEDUCTIONS;
  const dedSum=dedList.reduce((s,d)=>s+contract*(parseFloat(d.pct)||0)/100,0);
  const net=contract-dedSum;
  const catTotals=MAT_CATS.map(c=>({name:c,amt:(mdata.materials||[]).filter(x=>x.category===c).reduce((s,x)=>s+materialAmount(x),0),color:CAT_COLORS[c]})).filter(x=>x.amt>0);
  const matCost=catTotals.reduce((s,x)=>s+x.amt,0);
  const profit=net-matCost;
  const profitPct=contract?profit/contract*100:0;
  const days=projDurationDays(p);
  const startShow=p.startDate||fmtD(p.createdAt);
  const endShow=p.completedAt?fmtD(p.completedAt):fmtD(Date.now());

  const ops=[{t:'header',name:p.name,client:p.client,loc:p.location}];
  ops.push({t:'kv',label:'開工日期',value:startShow});
  ops.push({t:'kv',label:'結案日期',value:endShow});
  ops.push({t:'kv',label:'工程花費時間',value:days+' 天'});
  ops.push({t:'gap',h:10});
  ops.push({t:'section',title:'💰 財務總結'});
  ops.push({t:'kv',label:'承攬金額(未稅)',value:money(contract)});
  dedList.forEach(d=>ops.push({t:'kv',label:'扣除：'+d.name+'（'+d.pct+'%）',value:'-'+money(contract*(parseFloat(d.pct)||0)/100),sub:true}));
  ops.push({t:'kv',label:'淨承攬金額',value:money(net)});
  ops.push({t:'kv',label:'支出成本',value:'-'+money(matCost)});
  ops.push({t:'kvbig',label:'最終利潤',value:money(profit),color:profit>=0?'#16a34a':'#dc2626'});
  ops.push({t:'kvbig',label:'利潤率（利潤÷承攬金額）',value:pct1(profitPct)+'%',color:'#111827'});
  ops.push({t:'gap',h:10});
  ops.push({t:'section',title:'📊 各分類花費佔比'});
  if(catTotals.length)catTotals.forEach(c=>ops.push({t:'bar',name:c.name,amt:c.amt,pct:matCost?c.amt/matCost*100:0,color:c.color}));
  else ops.push({t:'kv',label:'尚無支出資料',value:''});
  ops.push({t:'gap',h:8});
  ops.push({t:'footer',text:'製表日期：'+fmtD(Date.now())});

  const H_OF={header:138,kv:36,kvbig:52,section:38,bar:52,footer:32};
  const heightOf=op=>op.t==='gap'?op.h:H_OF[op.t];
  const W=720,PAD=32;
  let totalH=8;
  ops.forEach(op=>{totalH+=heightOf(op);});
  totalH+=16;

  const cv=document.createElement('canvas'),scale=2;
  cv.width=W*scale;cv.height=totalH*scale;
  const ctx=cv.getContext('2d');ctx.scale(scale,scale);
  ctx.fillStyle='#eef0f3';ctx.fillRect(0,0,W,totalH);

  let y=0;
  ops.forEach(op=>{
    const h=heightOf(op);
    if(op.t==='header'){
      ctx.fillStyle='#111827';ctx.fillRect(0,0,W,h);
      ctx.fillStyle='#ffc400';ctx.font='700 13px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.fillText('簡易報表',PAD,32);
      ctx.fillStyle='#fff';ctx.font='900 25px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.fillText(ctxEllipsis(ctx,op.name||'',W-PAD*2),PAD,68);
      ctx.font='400 14px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#cbd5e1';
      ctx.fillText('業主／主包：'+ctxEllipsis(ctx,op.client||'—',(W-PAD*2)/2-6),PAD,94);
      ctx.fillText('施作地址：'+ctxEllipsis(ctx,op.loc||'—',W-PAD*2),PAD,116);
    }else if(op.t==='section'){
      y+=8;
      ctx.fillStyle='#111827';ctx.font='700 15px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.textAlign='left';ctx.fillText(op.title,PAD,y+20);
      ctx.strokeStyle='#d7dbe2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD,y+30);ctx.lineTo(W-PAD,y+30);ctx.stroke();
      y-=8;
    }else if(op.t==='kv'){
      ctx.font=(op.sub?'400 13px':'400 15px')+' -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.fillStyle=op.sub?'#9aa2af':'#6b7280';ctx.textAlign='left';
      ctx.fillText(ctxEllipsis(ctx,op.label,W*0.55),PAD+(op.sub?10:0),y+24);
      ctx.font=(op.sub?'700 13px':'700 15px')+' -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
      ctx.fillStyle='#111827';ctx.textAlign='right';
      ctx.fillText(op.value,W-PAD,y+24);
      ctx.textAlign='left';
    }else if(op.t==='kvbig'){
      ctx.fillStyle='rgba(127,127,127,.12)';ctx.fillRect(PAD-10,y+6,W-PAD*2+20,h-12);
      ctx.font='700 14px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#6b7280';ctx.textAlign='left';
      ctx.fillText(op.label,PAD,y+32);
      ctx.font='900 22px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle=op.color||'#111827';ctx.textAlign='right';
      ctx.fillText(op.value,W-PAD,y+34);
      ctx.textAlign='left';
    }else if(op.t==='bar'){
      const bw=W-PAD*2;
      ctx.font='700 14px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#111827';ctx.textAlign='left';
      ctx.fillText(op.name,PAD,y+18);
      ctx.textAlign='right';ctx.font='400 13px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#6b7280';
      ctx.fillText(money(op.amt)+'　'+pct1(op.pct)+'%',W-PAD,y+18);
      ctx.textAlign='left';
      ctx.fillStyle='#e2e5ea';ctx.beginPath();ctx.roundRect?ctx.roundRect(PAD,y+26,bw,10,5):ctx.rect(PAD,y+26,bw,10);ctx.fill();
      ctx.fillStyle=op.color||'#3b82f6';
      const fw=Math.max(4,bw*Math.min(1,op.pct/100));
      ctx.beginPath();ctx.roundRect?ctx.roundRect(PAD,y+26,fw,10,5):ctx.rect(PAD,y+26,fw,10);ctx.fill();
    }else if(op.t==='footer'){
      ctx.font='400 12px -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';ctx.fillStyle='#9aa2af';ctx.textAlign='center';
      ctx.fillText(op.text,W/2,y+20);
      ctx.textAlign='left';
    }
    y+=h;
  });

  return new Promise(resolve=>cv.toBlob(resolve,'image/png'));
}

async function exportCloseoutCSV(){
  await loadMod('materials');
  const p=curProject();
  const contract=parseFloat(p.finalContract)||0;
  const dedList=(p.deductions&&p.deductions.length)?p.deductions:DEFAULT_DEDUCTIONS;
  const dedSum=dedList.reduce((s,d)=>s+contract*(parseFloat(d.pct)||0)/100,0);
  const net=contract-dedSum;
  const matCost=matCostTotal();
  const profit=net-matCost;
  const profitPct=contract?profit/contract*100:0;
  const days=projDurationDays(p);
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const lines=[];
  const row=(...a)=>lines.push(a.map(q).join(','));
  row('工程結案報表',p.name);
  row('業主／主包',p.client||'');
  row('施作地址',p.location||'');
  row('開工日期',p.startDate||fmtD(p.createdAt));
  row('結案日期',p.completedAt?fmtD(p.completedAt):fmtD(Date.now()));
  row('工程花費時間(天)',days);
  row('承攬金額(未稅)',contract);
  dedList.forEach(d=>row('扣除-'+d.name+'('+d.pct+'%)',-(contract*(parseFloat(d.pct)||0)/100)));
  row('淨承攬金額',net);
  row('支出成本合計',-matCost);
  row('最終利潤',profit);
  row('利潤率(%)',pct1(profitPct));
  row('');
  row('日期','分類','項目/說明','廠商','數量','單位','單價','金額');
  (mdata.materials||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(it=>{
    const amt=materialAmount(it),isPetty=it.category==='零用金';
    row(it.date||'',it.category||'',isPetty?((it.pettyType||'零用金')+'｜'+(it.name||'')):(it.name||''),
      isPetty?'':(it.vendor||''), isPetty?'':(it.qty||''), isPetty?'':(it.unit||''),
      isPetty?'':(it.price||''), amt);
  });
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  await saveBlob(blob,'結案報表_'+p.name.replace(/[\\/:*?"<>|]/g,'')+'_'+fmtD(Date.now()).replace(/-/g,'')+'.csv');
}

async function saveMaterial(){
  const cat=$('mCat').value,date=$('mDate').value;
  if(!date){toast('請選擇日期');return;}
  const p=curProject();
  let rec=genCtx.id?(mdata.materials||[]).find(x=>x.id===genCtx.id):{id:uid(),projectId:p.id,createdAt:Date.now()};
  if(cat==='零用金'){
    const amt=parseFloat($('mAmount').value)||0;
    if(!amt){toast('請輸入金額');return;}
    Object.assign(rec,{category:cat,date:date,pettyType:$('mPettyType').value,name:$('mDesc').value.trim()||$('mPettyType').value,amount:amt,advanced:!!$('mAdvanced').checked,qty:'',unit:'',price:'',vendor:'',note:$('mNote').value.trim()});
  }else{
    const name=$('mName').value.trim();
    if(!name){toast('請輸入品項名稱');return;}
    const vendorName=$('mVendor').value.trim();
    Object.assign(rec,{category:cat,date:date,name:name,qty:$('mQty').value,unit:$('mUnit').value.trim(),price:$('mPrice').value,vendor:vendorName,amount:'',pettyType:'',advanced:false,note:$('mNote').value.trim()});
    if(vendorName)await ensureVendor(vendorName);
  }
  await dbPut('materials',rec);closeModal();await loadMod('materials');
  if(state.view==='mod'&&state.mod==='materials')renderModView();
  toast('已儲存');
}

  bpEditing=id||null;bpPending=null;
  const it=id?(mdata.blueprints||[]).find(x=>x.id===id):null;
  modal('<div class="sheet-h"><b>'+(it?'圖紙標記':'新增圖紙')+'</b><button class="x" onclick="closeModal()">✕</button></div>'+
    (it?'<label class="f" style="margin-top:0">圖紙名稱</label><input class="in" id="bpName" value="'+esc(it.name)+'" onchange="renameBlueprint(\''+it.id+'\',this.value)">'+
      '<div class="bpwrap" id="bpWrap"><img id="bpImg" src=""></div><div class="mut" style="font-size:12px;margin:6px 0">點圖片任意位置新增標記點</div><div class="pinlist" id="pinList"></div>'+
      '<div class="two" style="margin-top:10px"><button class="btn" onclick="exportBlueprint(\''+it.id+'\')">💾 匯出標記圖</button><button class="btn red" onclick="delBlueprint(\''+it.id+'\')">🗑 刪除圖紙</button></div>'
      :'<label class="f" style="margin-top:0">圖紙名稱</label><input class="in" id="bpName" placeholder="例如：3F 機電施工圖" value="施工圖紙">'+
       '<div class="mut" style="font-size:12px;margin:6px 0">支援圖片格式圖紙（大尺寸圖面建議先拍照或截圖後匯入）</div>'+
       '<div class="two"><label class="btn y">📷 拍照<input type="file" accept="image/*" capture="environment" hidden onchange="bpPick(this)"></label><label class="btn">🖼 選擇圖檔<input type="file" accept="image/*" hidden onchange="bpPick(this)"></label></div>'+
       '<div class="prevbox" id="bpPreview">尚未選擇圖紙</div><div class="gap"></div><button class="btn dark" onclick="saveBlueprint()">💾 儲存圖紙</button>'));
  if(it){getFull(it.id,'blueprintPhotos').then(u=>{$('bpImg').src=u;bindBpTap();});renderPins(it);}
}
function bpPick(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  bpPending=f;
  const u=URL.createObjectURL(f);$('bpPreview').innerHTML='<img src="'+u+'">';
}
async function saveBlueprint(){
  if(!bpPending){toast('請先選擇圖紙圖片');return;}
  const name=$('bpName').value.trim()||'施工圖紙';
  busy(true,'處理圖紙中…');
  try{
    const bmp=await loadBitmap(bpPending);
    const MAXW=1600,sc=Math.min(1,MAXW/bmp.width),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    const blob=await cvBlob(c,0.85);
    const p=curProject();
    const rec={id:uid(),projectId:p.id,name:name,pins:[],createdAt:Date.now()};
    const t=db.transaction(['blueprints','blueprintPhotos'],'readwrite');
    t.objectStore('blueprints').put(rec);t.objectStore('blueprintPhotos').put({id:rec.id,blob:blob});
    await txDone(t);
    closeModal();await loadMod('blueprints');
    if(state.view==='mod'&&state.mod==='blueprints')renderModView();
    toast('已儲存圖紙');
  }catch(e){alert('處理失敗：'+(e&&e.message||e));}
  finally{busy(false);}
}
async function renameBlueprint(id,name){
  const it=(mdata.blueprints||[]).find(x=>x.id===id);if(!it)return;
  it.name=name.trim()||it.name;await dbPut('blueprints',it);await loadMod('blueprints');
}
function bindBpTap(){
  const img=$('bpImg');if(!img)return;
  img.onclick=(e)=>{
    const r=img.getBoundingClientRect();
    const xp=((e.clientX-r.left)/r.width*100).toFixed(1),yp=((e.clientY-r.top)/r.height*100).toFixed(1);
    const t=prompt('這個位置的標記文字：');
    if(t&&t.trim())addPin(bpEditing,+xp,+yp,t.trim());
  };
}
async function addPin(id,x,y,text){
  const it=(mdata.blueprints||[]).find(b=>b.id===id);if(!it)return;
  it.pins=it.pins||[];it.pins.push({x:x,y:y,text:text});
  await dbPut('blueprints',it);renderPins(it);
}
function renderPins(it){
  const wrap=$('bpWrap');if(!wrap)return;
  [...wrap.querySelectorAll('.pin')].forEach(p=>p.remove());
  (it.pins||[]).forEach((pin,i)=>{
    const d=document.createElement('div');d.className='pin';d.style.left=pin.x+'%';d.style.top=pin.y+'%';d.innerHTML='<span>'+(i+1)+'</span>';d.title=pin.text;
    wrap.appendChild(d);
  });
  const list=$('pinList');if(list)list.innerHTML=(it.pins||[]).map((pin,i)=>'<div class="pinrow"><b>'+(i+1)+'</b><div style="flex:1">'+esc(pin.text)+'</div><button class="rmbtn" onclick="rmPin(\''+it.id+'\','+i+')">✕</button></div>').join('');
}
async function rmPin(id,idx){
  const it=(mdata.blueprints||[]).find(b=>b.id===id);if(!it)return;
  it.pins.splice(idx,1);await dbPut('blueprints',it);renderPins(it);
}
async function delBlueprint(id){
  if(!(await askConfirm('確定刪除此圖紙？')))return;
  await dbDel('blueprints',id);await dbDel('blueprintPhotos',id);
  const key='blueprintPhotos:'+id;if(urlCache[key]){URL.revokeObjectURL(urlCache[key]);delete urlCache[key];}
  closeModal();await loadMod('blueprints');
  if(state.view==='mod')renderModView();toast('已刪除');
}
async function exportBlueprint(id){
  const it=(mdata.blueprints||[]).find(b=>b.id===id);if(!it)return;
  busy(true,'匯出中…');
  try{
    const u=await getFull(id,'blueprintPhotos'),img=new Image();img.src=u;await img.decode();
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');
    x.drawImage(img,0,0);
    (it.pins||[]).forEach((pin,i)=>{
      const px=img.width*pin.x/100,py=img.height*pin.y/100,r=Math.max(14,img.width/60);
      x.fillStyle='#dc2626';x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
      x.fillStyle='#fff';x.font='bold '+Math.round(r*1.1)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(i+1),px,py);
      x.font='bold '+Math.round(r)+'px -apple-system,"PingFang TC",sans-serif';x.textAlign='left';
      const tw=x.measureText(pin.text).width+16;
      x.fillStyle='rgba(0,0,0,.75)';x.fillRect(px+r,py-r,tw,r*2);
      x.fillStyle='#fff';x.textBaseline='middle';x.fillText(pin.text,px+r+8,py);
    });
    await saveBlob(await cvBlob(c,0.9),'blueprint_'+fmtD(Date.now())+'.jpg');
  }catch(e){alert('匯出失敗：'+(e&&e.message||e));}
  finally{busy(false);}
}
async function blueprintListView(){
  await loadMod('blueprints');
  const list=(mdata.blueprints||[]).slice().sort((a,b)=>b.createdAt-a.createdAt);
  let html='<button class="btn sm" style="margin-bottom:10px" onclick="go(\'more\')">← 返回更多</button><div class="card" style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">📐 圖紙標記</h2><span class="mut">共 '+list.length+' 張</span></div>'+
    '<button class="btn y" style="margin-bottom:10px" onclick="openBlueprintForm()">＋ 新增圖紙</button>';
  if(!list.length)html+='<div class="empty"><div class="big">📐</div><p>尚無圖紙</p></div>';
  html+=list.map(it=>'<div class="rec" onclick="openBlueprintForm(\''+it.id+'\')"><img data-pid="'+it.id+'" data-store="blueprintPhotos" src="" alt=""><div class="rb"><div class="rt">'+esc(it.name)+'</div><div class="rm">標記點：'+(it.pins?it.pins.length:0)+' 個</div></div></div>').join('');
  return html;
}

function reportList(){
  return (rep.scope==='all'?recs.slice():filtered()).sort((a,b)=>a.createdAt-b.createdAt);
}
function reportHTML(list){
  const p=curProject(),per=rep.per,rows=per/2;
  if(!list.length)return '<div class="empty">沒有可匯出的紀錄</div>';
  const pages=[];for(let i=0;i<list.length;i+=per)pages.push(list.slice(i,i+per));
  const dr=fmtD(list[0].createdAt)+(fmtD(list[list.length-1].createdAt)!==fmtD(list[0].createdAt)?' ～ '+fmtD(list[list.length-1].createdAt):'');
  return pages.map((pg,pi)=>{
    const cells=pg.map((r,k)=>{
      const no=pi*per+k+1;
      return '<div class="cell"><div class="ph"><img data-pid="'+r.id+'" alt=""></div><table class="ct">'+
        '<tr><th>編號</th><td>'+String(no).padStart(3,'0')+'</td><th>狀態</th><td><span class="st" style="background:'+ST[r.status].c+'">'+ST[r.status].n+'</span></td></tr>'+
        '<tr><th>項目</th><td colspan="3">'+esc(r.title)+'</td></tr>'+
        '<tr><th>位置</th><td colspan="3">'+esc(r.location||'—')+'</td></tr>'+
        '<tr><th>日期</th><td colspan="3">'+fmt(r.createdAt)+'</td></tr>'+
        '<tr><th>說明</th><td colspan="3"><div class="clamp">'+(esc(r.desc)||'—')+'</div></td></tr></table></div>';
    }).join('');
    return '<section class="pg"><h1 class="pg-t">'+esc(rep.title||'工程相片紀錄表')+'</h1>'+
      '<table class="pg-i"><tr><th>工程名稱</th><td>'+esc(p.name)+'</td><th>業主／主包</th><td>'+esc(p.client||'—')+'</td></tr>'+
      '<tr><th>施作位置</th><td>'+esc(p.location||'—')+'</td><th>紀錄期間</th><td>'+dr+'</td></tr>'+
      '<tr><th>填表人</th><td>'+esc(rep.by||'')+'</td><th>製表日期</th><td>'+fmtD(Date.now())+'</td></tr></table>'+
      '<div class="pg-g" style="grid-template-rows:repeat('+rows+',1fr)">'+cells+'</div>'+
      '<div class="pg-f">第 '+(pi+1)+' / '+pages.length+' 頁　共 '+list.length+' 張</div></section>';
  }).join('');
}
function buildReport(){
  const list=reportList(),html=reportHTML(list);
  const pv=$('repPrev');if(!pv)return;
  pv.innerHTML=html;$('printRoot').innerHTML=html;
  $('repCount').textContent='將輸出 '+list.length+' 筆紀錄，共 '+Math.ceil(list.length/rep.per)+' 頁 A4';
  fitReport();hydrate();
}
function fitReport(){
  const pv=$('repPrev'),m=$('main');if(!pv||!m)return;
  pv.style.zoom=Math.min(1,(m.clientWidth-24)/794);
}
window.addEventListener('resize',fitReport);
async function printReport(){
  if(!reportList().length){toast('沒有可匯出的紀錄');return;}
  busy(true,'準備報表…');
  try{await hydrate();}finally{busy(false);}
  window.print();
}

    '<button class="btn sm" onclick="pAddDed()">＋ 新增扣除項目</button><div class="gap"></div>'+
    '<div class="stat"><b id="pNet">'+money(0)+'</b><span>淨承攬金額（預覽）</span></div><div class="gap"></div><div class="gap"></div>'+

    (p?'<div class="gap"></div><button class="btn red" onclick="delProject(\''+p.id+'\')">🗑 刪除此案場</button>':''));

function renderPSt(){
  $('pSt').innerHTML=[['active','進行中','#16a34a'],['done','已完工','#6b7280']].map(a=>'<button class="chip '+(pStatus===a[0]?'on':'')+'" style="height:52px;'+(pStatus===a[0]?'background:'+a[2]+';border-color:'+a[2]:'')+'" onclick="pStatus=\''+a[0]+'\';renderPSt()">'+a[1]+'</button>').join('');
}
function pDedRowHTML(d,i){
  return '<div class="ckrow"><input type="text" placeholder="扣除項目名稱" value="'+esc(d.name)+'" oninput="pDed['+i+'].name=this.value"><input type="number" style="width:64px" value="'+d.pct+'" oninput="pDed['+i+'].pct=+this.value;pFinRecalc()">%<span class="mut pdedamt" data-i="'+i+'" style="width:100px;text-align:right;flex:none">NT$ 0</span><button class="rmbtn" onclick="pDed.splice('+i+',1);renderPDed()">✕</button></div>';
}
function renderPDed(){const box=$('pDedBox');if(!box)return;box.innerHTML=pDed.map(pDedRowHTML).join('');pFinRecalc();}
function pAddDed(){pDed.push({name:'',pct:0});renderPDed();}
function pFinRecalc(){
  const el=$('pContract');if(!el)return;
  const contract=parseFloat(el.value)||0;
  let dedSum=0;
  pDed.forEach((d,i)=>{
    const amt=contract*(parseFloat(d.pct)||0)/100;dedSum+=amt;
    const sp=document.querySelector('.pdedamt[data-i="'+i+'"]');if(sp)sp.textContent=money(amt);
  });
  if($('pNet'))$('pNet').textContent=money(contract-dedSum);
}
async function saveProject(id){
  const name=$('pName').value.trim();
  if(!name){toast('請輸入工程名稱');return;}
  const p=id?projects.find(x=>x.id===id):{id:uid(),createdAt:Date.now()};
  const wasDone=p.status==='done';
  Object.assign(p,{name:name,client:$('pClient').value.trim(),location:$('pLoc').value.trim(),status:pStatus,
    startDate:($('pStart')&&$('pStart').value)||'',
    contractEndDate:($('pContractEnd')&&$('pContractEnd').value)||'',
    finalContract:parseFloat($('pContract').value)||0,deductions:pDed.filter(d=>d.name)});
  if(pStatus==='done'&&!wasDone&&!p.completedAt)p.completedAt=Date.now();
  if(pStatus!=='done')p.completedAt='';
  await dbPut('projects',p);
  if(!id){curId=p.id;lsSet('cur',curId);}
  closeModal();await loadProjects();await loadRecs();
  if(!id)state.view='records';
  render();toast('已儲存案場');
}
async function delProject(id){
  const n=counts[id]||0;
  if(!(await askConfirm('確定刪除此案場？其中 '+n+' 筆紀錄與照片將一併刪除，無法復原。')))return;
  const ids=await req(store('records').index('projectId').getAllKeys(id));
  await delRecordDB(ids);
  ids.forEach(i=>{const key='photos:'+i;if(urlCache[key]){URL.revokeObjectURL(urlCache[key]);delete urlCache[key];}});
  for(const sName of EXTRA_STORES){
    if(sName==='blueprintPhotos')continue;
    const rows=await req(store(sName).index('projectId').getAllKeys(id));
    const t=db.transaction(sName,'readwrite');rows.forEach(rid=>t.objectStore(sName).delete(rid));await txDone(t);
    if(sName==='blueprints'){const t2=db.transaction('blueprintPhotos','readwrite');rows.forEach(rid=>t2.objectStore('blueprintPhotos').delete(rid));await txDone(t2);}
  }
  const t=db.transaction('projects','readwrite');t.objectStore('projects').delete(id);await txDone(t);
  closeModal();await loadProjects();await loadRecs();render();toast('已刪除案場');
}

/* ========== 備份匯出／匯入 ========== */
const b2d=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b);});
async function exportBackup(){
  busy(true,'打包備份中…');
  try{
    const ps=await dbAll('projects'),rs=await dbAll('records'),phs=await dbAll('photos');
    const photos=[];for(const p of phs)photos.push({id:p.id,data:await b2d(p.blob)});
    const extra={};
    for(const s of EXTRA_STORES){
      if(s==='blueprintPhotos'){
        const arr=await dbAll(s);extra[s]=[];for(const p of arr)extra[s].push({id:p.id,data:await b2d(p.blob)});
      }else extra[s]=await dbAll(s);
    }
    const blob=new Blob([JSON.stringify({v:2,at:Date.now(),projects:ps,records:rs,photos:photos,extra:extra})],{type:'application/json'});
    await saveBlob(blob,'sitelog_backup_'+fmtD(Date.now()).replace(/-/g,'')+'.json');
  }catch(e){alert('匯出失敗：'+(e&&e.message||e));}
  finally{busy(false);}
}
async function importBackup(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!(await askConfirm('匯入會合併備份內容（相同編號將覆蓋）。繼續？','繼續匯入'))){inp.value='';return;}
  busy(true,'匯入中…');
  try{
    const d=JSON.parse(await f.text());
    for(const p of d.projects||[])await dbPut('projects',p);
    for(const r of d.records||[])await dbPut('records',r);
    for(const ph of d.photos||[])await dbPut('photos',{id:ph.id,blob:await (await fetch(ph.data)).blob()});
    if(d.extra){
      for(const s of EXTRA_STORES){
        const arr=d.extra[s]||[];
        if(s==='blueprintPhotos'){for(const p of arr)await dbPut(s,{id:p.id,blob:await (await fetch(p.data)).blob()});}
        else{for(const r of arr)await dbPut(s,r);}
      }
    }
    await loadProjects();await loadRecs();render();toast('匯入完成');
  }catch(e){alert('匯入失敗：'+(e&&e.message||e));}
  finally{busy(false);inp.value='';}
}

/* ========== 啟動 ========== */
function setIcon(){
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#111827';x.fillRect(0,0,180,180);
  x.fillStyle='#ffc400';x.beginPath();x.arc(90,90,68,0,Math.PI*2);x.fill();
  x.fillStyle='#111827';x.font='900 96px -apple-system,"PingFang TC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('工',90,96);
  $('touchIcon').href=c.toDataURL('image/png');
}
(async function boot(){
  setIcon();
  const th=lsGet('theme');
  if(th==='dark'){document.documentElement.dataset.theme='dark';$('themeBtn').textContent='☀️';}
  try{db=await openDB();}
  catch(e){$('main').innerHTML='<div class="empty"><div class="big">⚠️</div><p>此瀏覽器無法使用本機資料庫。<br>請勿使用無痕模式，並確認是用 Safari 開啟。</p></div>';return;}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  await loadProjects();await loadRecs();
  if(!projects.length)state.view='more';
  render();
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
